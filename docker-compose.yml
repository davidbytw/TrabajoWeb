# nombre fijo: sin el, Compose usa el de la carpeta y dos copias en carpetas con el mismo nombre se pisarian
name: booklog

services:
  db:
    image: postgres:16
    # los ${...} salen del .env de esta carpeta
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # publicado para la aplicacion, que corre en la maquina y no en un contenedor
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # el esquema se aplica solo con el volumen vacio; ",z" es para SELinux
      - ./db/schema/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro,z
    healthcheck:
      # por TCP: mientras se aplica el esquema la base solo escucha en el socket local
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -h 127.0.0.1"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 120s

  # corre requests.hurl contra la aplicacion; con el perfil "test", `docker compose up` no lo levanta
  hurl:
    image: ghcr.io/orange-opensource/hurl:7.1.0
    profiles: ["test"]
    # usa la red de la maquina para llegar a la aplicacion en localhost:8080
    network_mode: host
    volumes:
      - ./requests.hurl:/requests.hurl:ro,z
    command: ["--test", "--color", "--variable", "base_url=http://localhost:8080", "/requests.hurl"]

volumes:
  pgdata:
